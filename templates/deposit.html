{% extends "base.html" %}
{% block title %}Deposit | Space X{% endblock %}
{% block content %}
<style>
.dep{max-width:520px;margin:auto;padding:22px 16px 100px;color:#fff}
.dep label{display:block;margin:17px 0 8px}
.dep input,.dep select{box-sizing:border-box;width:100%;padding:14px;border:1px solid #f3b4d2;border-radius:11px;background:#fff;color:#222;font-size:16px}
.dep button{width:100%;margin-top:22px;padding:15px;border:0;border-radius:11px;background:#ec4899;color:#fff;font-weight:bold}
.dep p{color:#e5e7eb;line-height:1.5;font-size:14px}
.dep a{color:#f9a8d4;text-decoration:none}
.dep .panel{background:#fff;color:#222;padding:20px;border-radius:16px}
</style>
<div class="dep">
<a href="{{ url_for('dashboard') }}">← Back</a>
<div class="panel">
<h2>Make a Deposit</h2>
<p style="color:#555">Enter your deposit details. Your request will remain pending until payment is verified.</p>
<form method="post">
<label>Amount (UGX)</label>
<input name="amount" type="number" min="20000" max="5000000" step="1" placeholder="Enter amount" required>
<label>Payment method</label>
<select name="method" required>
<option value="">Choose payment method</option>
<option value="MTN Mobile Money">MTN Mobile Money</option>
<option value="Airtel Money">Airtel Money</option>
</select>
<label>Payment reference</label>
<input name="reference" type="text" maxlength="100" placeholder="Enter transaction reference" required>
<button type="submit">Continue</button>
</form>
</div>
</div>
{% endblock %}
