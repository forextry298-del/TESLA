<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset User Password</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff7fb;color:#352333;font-family:Arial,sans-serif}
header{padding:22px 16px;background:linear-gradient(135deg,#ec4899,#f9a8d4);color:white}
main{max-width:520px;margin:20px auto;padding:15px}
.card{background:white;border:1px solid #f2c5da;border-radius:16px;padding:20px}
label{display:block;font-size:13px;font-weight:bold;margin-top:14px}
input{width:100%;padding:13px;border:1px solid #e9b7cf;border-radius:9px;margin-top:7px;font-size:15px}
button{width:100%;border:0;background:#ec4899;color:white;border-radius:10px;padding:14px;font-weight:bold;margin-top:18px}
a{color:#be185d;text-decoration:none;font-weight:bold}
.note{font-size:13px;line-height:1.5;color:#826477}
</style>
</head>
<body>
<header>
<a href="/admin/users" style="color:white">← User Management</a>
<h2>Reset Password</h2>
<div>Account: {{ target['phone'] }}</div>
</header>
<main>
<div class="card">
<p class="note">Set a new password of at least 8 characters. The password will be stored as a secure hash.</p>
<form method="post">
<label for="password">New password</label>
<input id="password" type="password" name="password" minlength="8" autocomplete="new-password" required>
<label for="confirm">Confirm new password</label>
<input id="confirm" type="password" name="confirm" minlength="8" autocomplete="new-password" required>
<button type="submit">Reset password</button>
</form>
</div>
</main>
</body>
</html>
